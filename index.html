<script>
/* =====================================================================
   1. LOGIQUE MÉTIER : aucun accès à la page ni à la base.
   ===================================================================== */
const pad = (n) => String(n).padStart(2, '0');
const isoDate = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDate = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const monthOf = (s) => s.slice(0, 7);
const addDays = (s, n) => { const d = parseDate(s); d.setDate(d.getDate() + n); return isoDate(d); };
const addMonths = (m, n) => { const [y, mo] = m.split('-').map(Number); const d = new Date(y, mo - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const isDate = (s) => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && isoDate(parseDate(s)) === s;
const isMonth = (s) => typeof s === 'string' && /^\d{4}-(0[1-9]|1[0-2])$/.test(s);
const isTime = (s) => typeof s === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(s);
const weekStart = (s) => { const day = (parseDate(s).getDay() + 6) % 7; return addDays(s, -day); }; // Lundi
const NBSP = ' ';
const formatNumber = (n) => { const t = Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, NBSP); return n < 0 ? `−${t}` : t; };
const money = (n) => `${formatNumber(n)}${NBSP}FCFA`;

/* Téléphone : 10 chiffres ivoiriens, avec ou sans +225. Renvoie les chiffres internationaux ou null. */
function normalizePhone(raw) {
  const s = String(raw ?? '').trim();
  const digits = s.replace(/\D/g, '');
  if (/^(\+|00)/.test(s)) {
    const intl = digits.replace(/^00/, '');
    return intl.length >= 8 && intl.length <= 15 ? intl : null;
  }
  if (digits.length === 10) return `225${digits}`;
  if (digits.length === 13 && digits.startsWith('225')) return digits;
  return null;
}

/* --- Facturation --- */
function feeFor(student, month) {
  const hist = [...(student.feeHistory || [])].sort((a, b) => a.from.localeCompare(b.from));
  if (!hist.length) return 0;
  let fee = hist[0].amount;
  for (const h of hist) if (h.from <= month) fee = h.amount;
  return fee;
}
function setFee(student, amount, month) {
  const hist = (student.feeHistory || []).filter((h) => h.from !== month);
  if (feeFor(student, month) === amount && (student.feeHistory || []).length) return student.feeHistory;
  hist.push({ from: month, amount });
  return hist;
}
function dueFor(student, month) {
  if (month < student.startMonth) return 0;
  if ((student.exemptMonths || []).includes(month)) return 0;
  if ((student.inactiveRanges || []).some((r) => month >= r.from && month <= r.to)) return 0;
  if (student.endMonth && month > student.endMonth) return 0;
  return feeFor(student, month);
}
const paidFor = (payments, studentId, month) => payments
  .filter((p) => p.studentId === studentId && p.month === month).reduce((n, p) => n + p.amount, 0);
function dueDate(student, month) {
  const [y, m] = month.split('-').map(Number);
  const last = new Date(y, m, 0).getDate();
  return `${month}-${pad(Math.min(student.dueDay || 5, last))}`;
}
/* Payé si tout est versé ; En retard après la date d'échéance de l'élève ; sinon En attente. */
function monthStatus(student, payments, month, today) {
  const due = dueFor(student, month);
  const paid = paidFor(payments, student.id, month);
  const left = Math.max(0, due - paid);
  let status = 'attente';
  if (due === 0) status = 'none';
  else if (left === 0) status = 'paye';
  else if (today > dueDate(student, month)) status = 'retard';
  return { due, paid, left, status, dueOn: dueDate(student, month) };
}
function monthBalance(students, payments, month, today) {
  let collected = 0, left = 0, earlier = 0;
  for (const s of students) {
    const st = monthStatus(s, payments, month, today);
    collected += Math.min(st.paid, st.due);
    left += st.left;
    for (let m = s.startMonth; m < month; m = addMonths(m, 1)) earlier += monthStatus(s, payments, m, today).left;
  }
  return { collected, left, earlier };
}
/* Encaissements selon la date réelle du versement, pour le graphique. */
function incomeByMonth(payments, endMonth, count = 6) {
  const out = [];
  for (let i = count - 1; i >= 0; i--) {
    const month = addMonths(endMonth, -i);
    out.push({ month, amount: payments.filter((p) => monthOf(p.date) === month).reduce((n, p) => n + p.amount, 0) });
  }
  return out;
}

/* --- Planning : les horaires fixes génèrent les séances ; seule une séance pointée est stockée. --- */
const slotActive = (slot, date) => slot.from <= date && (!slot.to || date <= slot.to);
function sessionsOn(date, students, stored) {
  const map = new Map();
  const wd = parseDate(date).getDay();
  for (const st of students) {
    for (const slot of st.schedule || []) {
      if (slot.weekday !== wd || !slotActive(slot, date)) continue;
      const id = `${st.id}|${date}|${slot.time}`;
      map.set(id, { id, studentId: st.id, date, time: slot.time, duration: slot.duration, status: 'prevue', note: '', recurring: true });
    }
  }
  const ids = new Set(students.map((s) => s.id));
  for (const s of stored) if (s.date === date && ids.has(s.studentId)) map.set(s.id, s);
  return [...map.values()].sort((a, b) => a.time.localeCompare(b.time));
}
/* Annule un horaire à partir d'aujourd'hui sans réécrire les semaines passées. */
function mergeSchedule(oldSlots, nextSlots, today) {
  const key = (s) => `${s.weekday}|${s.time}|${s.duration}`;
  const wanted = new Set(nextSlots.map(key));
  const open = (oldSlots || []).filter((s) => !s.to);
  const openKeys = new Set(open.map(key));
  const out = (oldSlots || []).filter((s) => s.to);
  const yesterday = addDays(today, -1);
  for (const s of open) {
    if (wanted.has(key(s))) out.push(s);
    else if (s.from <= yesterday) out.push({ ...s, to: yesterday });
  }
  for (const s of nextSlots) if (!openKeys.has(key(s))) out.push({ ...s, from: today });
  return out;
}
function closeSchedule(slots, today) {
  const y = addDays(today, -1);
  return (slots || []).filter((s) => s.to || s.from <= y).map((s) => (s.to ? s : { ...s, to: y }));
}
/* Séances à rattraper : annulées, sans nouvelle date et sans renoncement. */
const toMakeUp = (stored, studentId) => stored.filter((s) => s.status === 'annulee' && !s.makeupId && !s.waived
  && (!studentId || s.studentId === studentId));
function unpointed(students, stored, today, days = 14) {
  const out = [];
  for (let i = days; i >= 1; i--) out.push(...sessionsOn(addDays(today, -i), students, stored).filter((s) => s.status === 'prevue'));
  return out;
}

/* --- Sauvegarde --- */
function parseBackup(text) {
  const data = JSON.parse(text);
  if (data?.app !== 'repetiteur' || !Array.isArray(data.students)) throw new Error('format');
  const students = data.students.filter((s) => s && typeof s.id === 'string' && typeof s.name === 'string' && s.name.trim()
    && isMonth(s.startMonth) && Array.isArray(s.feeHistory));
  const ids = new Set(students.map((s) => s.id));
  const sessions = (data.sessions || []).filter((s) => s && typeof s.id === 'string' && ids.has(s.studentId) && isDate(s.date) && isTime(s.time)
    && ['prevue', 'effectuee', 'annulee', 'reportee'].includes(s.status));
  const payments = (data.payments || []).filter((p) => p && typeof p.id === 'string' && ids.has(p.studentId) && isMonth(p.month) && isDate(p.date)
    && Number.isSafeInteger(p.amount) && p.amount > 0);
  const total = data.students.length + (data.sessions || []).length + (data.payments || []).length;
  return { students, sessions, payments, teacher: typeof data.teacher === 'string' ? data.teacher : '', rejected: total - students.length - sessions.length - payments.length };
}

/* =====================================================================
   2. BASE DE DONNÉES (IndexedDB)
   ===================================================================== */
const DB = {
  conn: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('RepetiteurDB', 1);
      r.onupgradeneeded = () => {
        for (const n of ['students', 'sessions', 'payments']) r.result.createObjectStore(n, { keyPath: 'id' });
        r.result.createObjectStore('meta');
      };
      r.onsuccess = () => { DB.conn = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  req(store, mode, fn) {
    return new Promise((res, rej) => {
      const r = fn(DB.conn.transaction(store, mode).objectStore(store));
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  },
  all: (s) => DB.req(s, 'readonly', (o) => o.getAll()),
  put: (s, v) => DB.req(s, 'readwrite', (o) => o.put(v)),
  del: (s, k) => DB.req(s, 'readwrite', (o) => o.delete(k)),
  getMeta: (k) => DB.req('meta', 'readonly', (o) => o.get(k)),
  setMeta: (k, v) => DB.req('meta', 'readwrite', (o) => o.put(v, k)),
  /* Écritures groupées : tout réussit ou rien n'est modifié. */
  batch(fn) {
    return new Promise((res, rej) => {
      const t = DB.conn.transaction(['students', 'sessions', 'payments', 'meta'], 'readwrite');
      fn((n) => t.objectStore(n));
      t.oncomplete = () => res();
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  },
};

/* --- Message temporaire, avec action facultative (Annuler) --- */
let toastTimer;
function toast(msg, action) {
  const el = $('#toast');
  const host = $('#sheet').open ? $('#sheet') : document.body;
  if (el.parentElement !== host) host.append(el);
  el.innerHTML = `<span>${esc(msg)}</span>${action ? `<button type="button">${esc(action.label)}</button>` : ''}`;
  el.classList.add('show');
  if (action) $('button', el).onclick = () => { el.classList.remove('show'); action.run(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), action?.sticky ? 60000 : action ? 8000 : 4000);
}

/* =====================================================================
   7. MINUTEURS ET CHRONOMÈTRE
   Basés sur l'heure réelle : ils restent justes si le téléphone ralentit
   l'application. L'alerte sonore n'est garantie qu'application ouverte.
   ===================================================================== */
const defaultTimer = (min, label) => ({ total: min * 60000, left: min * 60000, endAt: 0, running: false, label });
const Time = {
  session: defaultTimer(60, 'Séance'),
  exercise: defaultTimer(15, 'Exercice'),
  watch: { elapsed: 0, startedAt: 0, running: false },
};
const LS = 'repetiteur-timers';
function saveTimers() { try { localStorage.setItem(LS, JSON.stringify(Time)); } catch { /* facultatif */ } }
function restoreTimers() {
  try {
    const t = JSON.parse(localStorage.getItem(LS));
    if (t?.session && t?.exercise && t?.watch) Object.assign(Time, t);
  } catch { /* état par défaut */ }
}
const leftOf = (t) => (t.running ? t.endAt - Date.now() : t.left);
const watchOf = () => Time.watch.elapsed + (Time.watch.running ? Date.now() - Time.watch.startedAt : 0);
function fmtTime(ms, tenths = false) {
  const total = Math.max(0, tenths ? Math.floor(ms / 1000) : Math.ceil(ms / 1000));
  const base = `${pad(Math.floor(total / 60))}:${pad(total % 60)}`; // 90 min s'affiche 90:00
  return tenths ? `${base}.${Math.floor((ms % 1000) / 100)}` : base;
}
let audio, wakeLock, beepTimer;
function unlockAudio() {
  try { audio ??= new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch { /* sans son */ }
}
function beep() {
  try {
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = 880; g.gain.value = 0.3;
    o.connect(g); g.connect(audio.destination);
    o.start(); o.stop(audio.currentTime + 0.35);
  } catch { /* sans son */ }
  navigator.vibrate?.([400, 150, 400]);
}
async function syncWakeLock() {
  const need = Time.session.running || Time.exercise.running || Time.watch.running;
  try {
    if (need && !wakeLock && !document.hidden && navigator.wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if (!need && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch { wakeLock = null; }
}
function startTimer(key) {
  unlockAudio();
  const t = Time[key];
  if (t.left <= 0) t.left = t.total;
  t.endAt = Date.now() + t.left;
  t.running = true;
  saveTimers(); syncWakeLock(); renderTimers();
}
function pauseTimer(key) {
  const t = Time[key];
  t.left = Math.max(0, t.endAt - Date.now());
  t.running = false;
  saveTimers(); syncWakeLock(); renderTimers();
}
function setTimer(key, min, label) {
  const t = Time[key];
  t.total = min * 60000; t.left = t.total; t.running = false; t.endAt = 0;
  if (label !== undefined) t.label = label;
  saveTimers(); syncWakeLock(); renderTimers();
}
function ringAlarm(key) {
  const t = Time[key];
  const late = Math.max(0, Date.now() - t.endAt);
  t.running = false; t.left = 0;
  saveTimers(); syncWakeLock();
  const d = $('#alarm');
  d.dataset.key = key;
  d.innerHTML = `<h2 id="alarm-title" class="text-4xl">Temps écoulé</h2>
    <p class="text-xl">${esc(t.label)}${late > 60000 ? `, il y a ${Math.round(late / 60000)} min` : ''}</p>
    <button type="button" class="btn btn-primary w-full max-w-xs text-lg" data-act="alarm-stop" autofocus>Arrêter l'alerte</button>
    <button type="button" class="btn w-full max-w-xs" data-act="alarm-more">Ajouter 5 minutes</button>`;
  if (!d.open) d.showModal();
  clearInterval(beepTimer);
  beep();
  let n = 0;
  beepTimer = setInterval(() => { if (++n > 30) clearInterval(beepTimer); else beep(); }, 2000);
  renderTimers();
}
function stopAlarm() {
  clearInterval(beepTimer);
  $('#alarm').close();
}
const timerBlock = (key, title, presets, field) => {
  const t = Time[key];
  return `<section class="board grid gap-3" aria-label="${title}">
    <div class="flex justify-between items-baseline gap-2"><h2 class="text-lg">${title}</h2>${t.label !== title ? `<span class="text-sm text-chalkdim truncate">${esc(t.label)}</span>` : ''}</div>
    <div class="digits" role="timer" id="${key}-digits">${fmtTime(leftOf(t))}</div>
    <div class="meter" aria-hidden="true"><span id="${key}-meter"></span></div>
    <div class="flex flex-wrap gap-2 items-center">${presets.map((m) => `<button type="button" class="chalk-btn ${t.total === m * 60000 ? 'on' : ''}" data-act="timer-set" data-key="${key}" data-min="${m}">${m} min</button>`).join('')}
      <label class="flex items-center gap-1.5"><span class="sr-only">Durée libre en minutes</span><input class="chalk-input" id="${field}" inputmode="numeric" placeholder="Libre" autocomplete="off"></label>
      <button type="button" class="chalk-btn" data-act="timer-custom" data-key="${key}" data-field="${field}">OK</button></div>
    <p class="text-sm font-semibold" id="${field}-err" role="alert"></p>
    <div class="grid grid-cols-2 gap-2">
      <button type="button" class="chalk-btn on" id="${key}-go" data-act="timer-toggle" data-key="${key}"></button>
      <button type="button" class="chalk-btn" data-act="timer-reset" data-key="${key}">Réinitialiser</button></div></section>`;
};
function viewTimers(root) {
  root.innerHTML = `<div class="px-4 grid gap-3">
    ${timerBlock('session', 'Séance', [60, 90], 'session-free')}
    ${timerBlock('exercise', 'Exercice', [5, 15, 30], 'exercise-free')}
    <section class="board grid gap-3" aria-label="Chronomètre"><h2 class="text-lg">Chronomètre</h2>
      <div class="digits" role="timer" id="watch-digits">${fmtTime(watchOf(), true)}</div>
      <div class="grid grid-cols-2 gap-2"><button type="button" class="chalk-btn on" id="watch-go" data-act="watch-toggle"></button><button type="button" class="chalk-btn" data-act="watch-reset">Réinitialiser</button></div></section>
    <p class="text-sm text-muted">L'écran reste allumé tant qu'un minuteur tourne, si le téléphone l'autorise. Garde l'application ouverte : téléphone verrouillé ou autre app au premier plan, l'alerte peut ne pas sonner avant ton retour.</p>
  </div>`;
  renderTimers();
}
function renderTimers() {
  for (const k of ['session', 'exercise']) {
    const t = Time[k];
    const dg = $(`#${k}-digits`);
    if (!dg) continue;
    const left = leftOf(t);
    const txt = fmtTime(left);
    if (dg.textContent !== txt) dg.textContent = txt;
    $(`#${k}-meter`).style.width = `${Math.max(0, Math.min(100, (left / t.total) * 100))}%`;
    const go = $(`#${k}-go`);
    const lbl = t.running ? 'Pause' : left > 0 && left < t.total ? 'Reprendre' : 'Démarrer';
    if (go.textContent !== lbl) go.textContent = lbl;
    $$(`[data-act=timer-set][data-key=${k}]`).forEach((b) => b.classList.toggle('on', t.total === Number(b.dataset.min) * 60000));
  }
  const w = $('#watch-digits');
  if (w) {
    w.textContent = fmtTime(watchOf(), true);
    const lbl = Time.watch.running ? 'Pause' : watchOf() ? 'Reprendre' : 'Démarrer';
    const go = $('#watch-go');
    if (go.textContent !== lbl) go.textContent = lbl;
  }
  const mini = $('#mini');
  const run = Time.session.running ? Time.session : Time.exercise.running ? Time.exercise : null;
  mini.hidden = !run || state.view === 'minuteur';
  if (run) mini.textContent = `${run.label.slice(0, 14)} ${fmtTime(leftOf(run))}`;
}
setInterval(() => {
  for (const k of ['session', 'exercise']) if (Time[k].running && Time[k].endAt <= Date.now()) ringAlarm(k);
  renderTimers();
}, 200);

/* =====================================================================
   8. TABLEAU DE BORD
   ===================================================================== */
function viewDashboard(root) {
  const t = today();
  const list = sessionsOn(t, state.students, state.sessions);
  const remaining = list.filter((s) => s.status === 'prevue').length;
  const m = monthOf(t);
  const late = state.students.map((s) => ({ s, st: monthStatus(s, state.payments, m, t) })).filter((x) => x.st.status === 'retard').sort((a, b) => b.st.left - a.st.left);
  const lateTotal = late.reduce((n, x) => n + x.st.left, 0);
  const missed = unpointed(state.students, state.sessions, t);
  const makeups = toMakeUp(state.sessions);
  const needBackup = (state.students.length > 0) && (!state.lastBackup || Date.now() - state.lastBackup > 14 * 864e5);
  root.innerHTML = `<div class="px-4 grid gap-4">
    <section class="board"><p class="first-letter:uppercase text-chalkdim">${esc(dayLong(t))}</p>
      <p class="text-3xl font-bold mt-1">${list.length ? `${list.length} cours aujourd'hui` : "Pas de cours aujourd'hui"}</p>
      ${list.length ? `<p class="text-chalkdim mt-1">${remaining ? `${remaining} à pointer` : 'Tous pointés'}</p>` : ''}</section>
    ${late.length ? `<section class="card !border-late border-2"><div class="flex gap-2">${icon('alert')}<div class="min-w-0 flex-1"><h2 class="text-base">${late.length} impayé${late.length > 1 ? 's' : ''} en retard : ${esc(money(lateTotal))}</h2>
      <ul class="text-sm mt-1">${late.slice(0, 3).map((x) => `<li class="flex justify-between gap-2"><span class="min-w-0">${esc(x.s.name)}</span><span class="num">${esc(money(x.st.left))}</span></li>`).join('')}</ul>
      <a class="link text-sm" href="#finances">Voir les finances</a></div></div></section>` : ''}
    ${!state.students.length ? `<section class="card text-center grid gap-3"><p>Commence par ajouter tes élèves et leurs horaires : le planning se remplira chaque semaine.</p><button type="button" class="btn btn-primary" data-act="student-new">Ajouter un élève</button></section>` : ''}
    ${list.length ? `<section class="grid gap-3"><h2 class="text-lg">Aujourd'hui</h2>${list.map(sessionCard).join('')}</section>` : ''}
    ${missed.length ? `<section class="grid gap-3"><h2 class="text-lg">Séances passées à pointer (${missed.length})</h2>${missed.slice(-3).reverse().map((s) => `<div><p class="text-sm font-semibold text-muted mb-1 first-letter:uppercase">${esc(dayLong(s.date))}</p>${sessionCard(s)}</div>`).join('')}</section>` : ''}
    ${makeups.length ? `<section class="card flex justify-between items-center gap-3"><p><b>${makeups.length}</b> séance${makeups.length > 1 ? 's' : ''} à rattraper</p><a class="link" href="#eleves">Voir</a></section>` : ''}
    ${needBackup ? `<section class="card grid gap-2"><p>${state.lastBackup ? 'Ta dernière sauvegarde date de plus de 14 jours.' : "Tu n'as encore aucune sauvegarde."} Sans elle, perdre le téléphone efface tout.</p><button type="button" class="btn" data-act="export">Exporter les données</button></section>` : ''}
  </div>`;
}

/* =====================================================================
   9. SAUVEGARDE ET PARAMÈTRES
   ===================================================================== */
function viewSettings(root) {
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  root.innerHTML = `<div class="px-4 grid gap-4">
    <section class="card grid gap-3"><h2 class="text-lg">Sauvegarde</h2>
      <p>${state.lastBackup ? `Dernière sauvegarde le ${esc(new Intl.DateTimeFormat('fr-FR', { dateStyle: 'long' }).format(state.lastBackup))}.` : 'Aucune sauvegarde pour le moment.'}</p>
      <button type="button" class="btn btn-primary" data-act="export">Exporter les données</button>
      <label class="btn" for="import">Importer les données</label><input class="sr-only" type="file" id="import" accept=".json,application/json">
      <p class="text-sm text-muted">Le fichier n'est pas chiffré et contient les noms des élèves et les numéros des parents. Garde-le hors du téléphone, jamais dans un dépôt public.</p></section>
    <section class="card grid gap-3"><h2 class="text-lg">Ton nom</h2>
      <label><span class="field-label">Signature des messages WhatsApp</span><input class="input" id="teacher" autocomplete="name" value="${esc(state.teacher)}"></label></section>
    <section class="card grid gap-2"><h2 class="text-lg">Installation</h2>
      <p>${standalone ? 'Installée sur ce téléphone.' : ios ? "Dans Safari : Partager, puis « Sur l'écran d'accueil »." : "Dans Chrome : menu, puis « Installer l'application »."}</p>
      <p id="persist-state" class="text-sm text-muted"></p></section>
    <section class="card grid gap-3"><h2 class="text-lg">Effacement</h2><button type="button" class="btn btn-danger" data-act="erase">Effacer toutes les données</button></section>
    <p class="text-sm text-muted">Répétiteur, version 1.0</p></div>`;
  $('#teacher', root).addEventListener('change', async (e) => { await DB.setMeta('teacher', e.target.value.trim()); state.teacher = e.target.value.trim(); toast('Nom enregistré.'); });
  $('#import', root).addEventListener('change', importFile);
  navigator.storage?.persisted?.().then((ok) => {
    const el = $('#persist-state');
    if (el) el.textContent = ok ? 'Stockage protégé contre le nettoyage automatique du navigateur.' : "Stockage non garanti : le navigateur peut effacer les données si le téléphone manque d'espace. Exporte régulièrement.";
  });
}
async function exportData() {
  const payload = { app: 'repetiteur', version: 1, exportedAt: new Date().toISOString(), teacher: state.teacher, students: state.students, sessions: state.sessions, payments: state.payments };
  const name = `repetiteur-sauvegarde-${today()}.json`;
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const file = new File([blob], name, { type: 'application/json' });
  let shared = false;
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'Sauvegarde Répétiteur' }); shared = true; } catch (e) { if (e.name === 'AbortError') return; }
  }
  if (!shared) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  }
  await DB.setMeta('lastBackup', Date.now());
  await load(); render();
  toast('Sauvegarde créée. Copie-la hors du téléphone.');
}
async function importFile(e) {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  let r;
  try { r = parseBackup(await file.text()); } catch { toast("Ce fichier n'est pas une sauvegarde Répétiteur. Rien n'a été modifié."); return; }
  openSheet('Remplacer les données ?', `<p>Le fichier contient <b>${r.students.length}</b> élève(s), <b>${r.sessions.length}</b> séance(s) pointée(s) et <b>${r.payments.length}</b> versement(s).${r.rejected ? ` ${r.rejected} ligne(s) illisible(s) seront ignorées.` : ''}</p>
    <p>Les données actuelles du téléphone (${state.students.length} élève(s), ${state.payments.length} versement(s)) seront <b>remplacées</b>.</p>`,
  '<button type="button" class="btn" data-close>Annuler</button><button type="submit" class="btn btn-primary">Remplacer</button>', (d, form) => {
    form.addEventListener('submit', async () => {
      try {
        await DB.batch((o) => {
          for (const n of ['students', 'sessions', 'payments']) { o(n).clear(); r[n].forEach((x) => o(n).put(x)); }
          o('meta').put(r.teacher, 'teacher');
        });
        closeSheet(); await load(); render();
        toast('Données restaurées.');
      } catch (err) { closeSheet(); toast(`Restauration impossible (${err?.name}). Rien n'a été modifié.`); }
    });
  });
}
function openErase() {
  openSheet('Tout effacer ?', `<p>Élèves, séances et paiements seront supprimés de ce téléphone. Exporte d'abord si tu veux les récupérer.</p>
    <label><span class="field-label">Écris EFFACER pour confirmer</span><input class="input" name="c" autocomplete="off"></label><p class="err" data-err="c"></p>`,
  '<button type="submit" class="btn btn-danger">Effacer définitivement</button>', (d, form) => {
    form.addEventListener('submit', async () => {
      if (form.elements.c.value.trim().toUpperCase() !== 'EFFACER') { $('[data-err=c]', d).textContent = 'Écris exactement EFFACER.'; return; }
      await DB.batch((o) => { for (const n of ['students', 'sessions', 'payments', 'meta']) o(n).clear(); });
      closeSheet(); await load(); render(); toast('Données effacées.');
    });
  });
}

/* =====================================================================
   10. ACTIONS ET NAVIGATION
   ===================================================================== */
const ACTIONS = {
  'student-new': () => openStudentForm(),
  'student-open': (d) => openStudent(d.id),
  'student-edit': (d) => openStudentForm(student(d.id)),
  'student-archive': (d) => archiveStudent(d.id),
  'student-restore': (d) => restoreStudent(d.id),
  'student-delete': (d) => deleteStudentForm(d.id),
  point: (d) => pointSession(d.id, d.status),
  unpoint: (d) => unpoint(d.id),
  report: (d) => openMakeupForm(d.id, 'report'),
  'makeup-plan': (d) => openMakeupForm(d.id, 'makeup'),
  'makeup-waive': async (d) => { await DB.put('sessions', { ...findSession(d.id), waived: true }); await load(); render(); toast('Séance retirée des rattrapages.'); },
  note: (d) => openNote(d.id),
  'session-new': openSessionForm,
  'session-del': async (d) => {
    const s = findSession(d.id);
    await DB.batch((o) => {
      o('sessions').delete(s.id);
      if (s.makeupOf) {
        const src = state.sessions.find((x) => x.id === s.makeupOf);
        if (src) { const { makeupId, ...rest } = src; o('sessions').put({ ...rest, status: 'annulee' }); }
      }
    });
    await load(); render();
    toast(s.makeupOf ? 'Rattrapage supprimé. La séance reste à rattraper.' : 'Séance supprimée.');
  },
  'plan-mode': (d) => { state.planMode = d.mode; render(); },
  'plan-nav': (d) => { state.planDate = addDays(state.planDate || today(), Number(d.dir) * (state.planMode === 'jour' ? 1 : 7)); render(); },
  'plan-today': () => { state.planDate = null; render(); },
  'plan-day': (d) => { state.planDate = d.date; state.planMode = 'jour'; render(); },
  'fin-nav': (d) => { state.finMonth = addMonths(state.finMonth || monthOf(today()), Number(d.dir)); render(); },
  'fin-filter': (d) => { state.finFilter = d.v; render(); },
  'fin-open': (d) => openFinance(d.id, d.month),
  'pay-new': (d) => openPayForm(null, d.id, d.month),
  'pay-edit': (d) => openPayForm(state.payments.find((p) => p.id === d.id)),
  exempt: (d) => toggleExempt(d.id, d.month),
  'timer-toggle': (d) => (Time[d.key].running ? pauseTimer(d.key) : startTimer(d.key)),
  'timer-reset': (d) => setTimer(d.key, Time[d.key].total / 60000),
  'timer-set': (d) => { setTimer(d.key, Number(d.min), d.key === 'session' ? 'Séance' : 'Exercice'); },
  'timer-custom': (d) => {
    const input = $(`#${d.field}`);
    const err = $(`#${d.field}-err`);
    const min = Number(input.value);
    if (!Number.isInteger(min) || min < 1 || min > 600) { err.textContent = 'Saisis un nombre de minutes entre 1 et 600.'; input.focus(); return; }
    err.textContent = ''; input.value = '';
    setTimer(d.key, min);
  },
  'timer-from': (d) => { setTimer('session', Number(d.min), d.label); startTimer('session'); location.hash = '#minuteur'; },
  'watch-toggle': () => {
    const w = Time.watch;
    if (w.running) { w.elapsed += Date.now() - w.startedAt; w.running = false; } else { w.startedAt = Date.now(); w.running = true; }
    saveTimers(); syncWakeLock(); renderTimers();
  },
  'watch-reset': () => { Time.watch = { elapsed: 0, startedAt: 0, running: false }; saveTimers(); syncWakeLock(); renderTimers(); },
  'alarm-stop': () => { const k = $('#alarm').dataset.key; stopAlarm(); Time[k].left = Time[k].total; saveTimers(); renderTimers(); },
  'alarm-more': () => { const k = $('#alarm').dataset.key; stopAlarm(); Time[k].left = 300000; if (Time[k].total < 300000) Time[k].total = 300000; startTimer(k); },
  export: exportData,
  erase: openErase,
};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  ACTIONS[el.dataset.act]?.(el.dataset, el);
});
function render() {
  const v = state.view;
  $('#title').textContent = VIEWS[v];
  document.title = `${VIEWS[v]} - Répétiteur`;
  $$('.tabs a').forEach((a) => { if (a.dataset.tab === v) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  ({ accueil: viewDashboard, eleves: viewStudents, planning: viewPlanning, finances: viewFinances, minuteur: viewTimers, reglages: viewSettings }[v])($('#view'));
  renderTimers();
}
function route() {
  const h = location.hash.slice(1);
  const next = VIEWS[h] ? h : 'accueil';
  const changed = next !== state.view;
  state.view = next;
  render();
  if (changed) { scrollTo(0, 0); $('#title').focus({ preventScroll: true }); }
}
window.addEventListener('hashchange', route);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { syncWakeLock(); if (audio) audio.resume(); renderTimers(); } });

function registerSw() {
  if (!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('sw.js').then((reg) => {
    const offer = (w) => toast('Nouvelle version prête.', { label: 'Mettre à jour', sticky: true, run: () => w.postMessage('SKIP_WAITING') });
    if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      w?.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); });
    });
  }).catch(() => {});
  const had = !!navigator.serviceWorker.controller;
  let done = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had && !done) { done = true; location.reload(); } });
}

(async function init() {
  try {
    await DB.open();
    await load();
    restoreTimers();
    route();
    syncWakeLock();
    registerSw();
  } catch (e) {
    document.body.textContent = `Impossible d'ouvrir les données (${e?.name || e?.message}). Recharge la page. Tes données n'ont pas été modifiées.`;
  }
})();

</script>
</body>
